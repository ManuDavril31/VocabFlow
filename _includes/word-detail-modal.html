<div class="modal-backdrop" id="wordDetailModal" role="dialog" aria-modal="true">
  <div class="modal-sheet">
    <div class="sheet-handle"></div>
    
    <!-- Imagen mnemotécnica en modal -->
    <div class="modal-image-wrap" id="modalImageWrap">
      <img id="modalWordImage" class="modal-word-image" src="" alt="Ilustración">
    </div>

    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
      <div>
        <h3 style="font-size: 1.8rem; font-weight: 800; color: var(--text-primary);" id="modalWordTitle">borrow</h3>
        <span style="color: var(--text-secondary); font-size: 1.1rem;" id="modalWordIpa">/ˈbɑːroʊ/</span>
      </div>
      <button class="btn-audio-pill" id="btnModalAudio" aria-label="Escuchar palabra">
        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.2" fill="none">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
      </button>
    </div>

    <div style="font-size: 1.25rem; font-weight: 700; color: #38bdf8; margin-bottom: 14px;" id="modalWordTranslation">
      pedir prestado
    </div>

    <div class="sentence-box" style="margin-bottom: 14px;">
      <p class="sentence-text" id="modalWordSentence">
        Can I <strong>borrow</strong> your phone?
      </p>
      <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 6px;" id="modalWordSentenceTrans">
        ¿Puedo pedir prestado tu teléfono?
      </p>
    </div>

    <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 18px;" id="modalWordCategory">
      Verbos &bull; Nivel A2
    </div>

    <div style="display: flex; gap: 10px;">
      <button class="btn-hero-start" id="btnEditCurrentWord" style="flex: 1; margin: 0; min-height: 48px; font-size: 1rem; background: var(--bg-secondary); color: var(--accent-primary); border: 1px solid var(--accent-primary);">
        ✏️ Editar Palabra
      </button>
      <button class="btn-reveal" id="btnCloseWordModal" style="flex: 1; min-height: 48px; font-size: 1rem;">
        Cerrar
      </button>
    </div>
  </div>
</div>
