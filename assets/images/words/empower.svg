<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_empower" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="glow_empower" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="250" rx="20" fill="url(#bg_empower)"/>
  <!-- Decorative Grid / Aura -->
  <circle cx="200" cy="125" r="90" fill="none" stroke="#c7d2fe" stroke-width="1" opacity="0.15" stroke-dasharray="6,6"/>
  <circle cx="340" cy="30" r="70" fill="#c7d2fe" opacity="0.05"/>
  <circle cx="50" cy="220" r="50" fill="#c7d2fe" opacity="0.05"/>
  <!-- Main Visual Illustration -->
  <g filter="url(#glow_empower)">
    
      <!-- Wings expanding outward / energy lift -->
      <path d="M200 140 Q 140 100 120 60 Q 150 110 200 130" fill="#818cf8"/>
      <path d="M200 140 Q 260 100 280 60 Q 250 110 200 130" fill="#818cf8"/>
      <!-- Inner radiant wings -->
      <path d="M200 150 Q 160 125 140 95 Q 170 125 200 140" fill="#c7d2fe"/>
      <path d="M200 150 Q 240 125 260 95 Q 230 125 200 140" fill="#c7d2fe"/>
      <circle cx="200" cy="130" r="8" fill="#fde047"/>
    
  </g>
</svg>