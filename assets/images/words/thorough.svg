<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_thorough" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="glow_thorough" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="250" rx="20" fill="url(#bg_thorough)"/>
  <!-- Decorative Grid / Aura -->
  <circle cx="200" cy="125" r="90" fill="none" stroke="#93c5fd" stroke-width="1" opacity="0.15" stroke-dasharray="6,6"/>
  <circle cx="340" cy="30" r="70" fill="#93c5fd" opacity="0.05"/>
  <circle cx="50" cy="220" r="50" fill="#93c5fd" opacity="0.05"/>
  <!-- Main Visual Illustration -->
  <g filter="url(#glow_thorough)">
    
      <!-- Magnifying glass inspecting details with checkmarks -->
      <circle cx="185" cy="110" r="40" fill="#1e40af" stroke="#60a5fa" stroke-width="4"/>
      <line x1="215" y1="140" x2="255" y2="180" stroke="#60a5fa" stroke-width="7" stroke-linecap="round"/>
      <!-- Inspected document lines and checkmark inside lens -->
      <line x1="165" y1="100" x2="195" y2="100" stroke="#bfdbfe" stroke-width="3" stroke-linecap="round"/>
      <polyline points="170,120 180,130 205,105" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    
  </g>
</svg>