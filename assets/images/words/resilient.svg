<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_resilient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <filter id="glow_resilient" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="250" rx="20" fill="url(#bg_resilient)"/>
  <!-- Decorative Grid / Aura -->
  <circle cx="200" cy="125" r="90" fill="none" stroke="#34d399" stroke-width="1" opacity="0.15" stroke-dasharray="6,6"/>
  <circle cx="340" cy="30" r="70" fill="#34d399" opacity="0.05"/>
  <circle cx="50" cy="220" r="50" fill="#34d399" opacity="0.05"/>
  <!-- Main Visual Illustration -->
  <g filter="url(#glow_resilient)">
    
      <!-- Flexible bamboo bending in strong wind but not breaking -->
      <path d="M170 190 Q 230 130 200 50" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
      <!-- Bamboo nodes -->
      <ellipse cx="180" cy="160" rx="8" ry="4" fill="#34d399"/>
      <ellipse cx="205" cy="115" rx="8" ry="4" fill="#34d399"/>
      <ellipse cx="203" cy="75" rx="7" ry="3.5" fill="#34d399"/>
      <!-- Swift wind gusts -->
      <path d="M120 70 Q 160 60 250 70" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-dasharray="6,4"/>
      <path d="M110 110 Q 170 100 270 110" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-dasharray="6,4"/>
    
  </g>
</svg>