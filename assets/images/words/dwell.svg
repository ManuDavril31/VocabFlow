<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_dwell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <filter id="glow_dwell" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="250" rx="20" fill="url(#bg_dwell)"/>
  <!-- Decorative Grid / Aura -->
  <circle cx="200" cy="125" r="90" fill="none" stroke="#a1a1aa" stroke-width="1" opacity="0.15" stroke-dasharray="6,6"/>
  <circle cx="340" cy="30" r="70" fill="#a1a1aa" opacity="0.05"/>
  <circle cx="50" cy="220" r="50" fill="#a1a1aa" opacity="0.05"/>
  <!-- Main Visual Illustration -->
  <g filter="url(#glow_dwell)">
    
      <!-- Labyrinth / looping spiral of overthinking -->
      <path d="M200 120 m -10 0 a 10 10 0 1 0 20 0 a 10 10 0 1 0 -20 0" fill="none" stroke="#71717a" stroke-width="2"/>
      <path d="M200 120 m -25 0 a 25 25 0 1 0 50 0 a 25 25 0 1 0 -50 0" fill="none" stroke="#a1a1aa" stroke-width="2"/>
      <path d="M200 120 m -42 0 a 42 42 0 1 0 84 0 a 42 42 0 1 0 -84 0" fill="none" stroke="#d4d4d8" stroke-width="2.5"/>
      <!-- Stop hand / caution in center -->
      <circle cx="200" cy="120" r="6" fill="#f43f5e"/>
    
  </g>
</svg>