<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_lend" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <filter id="glow_lend" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="250" rx="20" fill="url(#bg_lend)"/>
  <!-- Decorative Grid / Aura -->
  <circle cx="200" cy="125" r="90" fill="none" stroke="#34d399" stroke-width="1" opacity="0.15" stroke-dasharray="6,6"/>
  <circle cx="340" cy="30" r="70" fill="#34d399" opacity="0.05"/>
  <circle cx="50" cy="220" r="50" fill="#34d399" opacity="0.05"/>
  <!-- Main Visual Illustration -->
  <g filter="url(#glow_lend)">
    
      <!-- Hand giving / offering outward -->
      <circle cx="200" cy="115" r="45" fill="#10b981" opacity="0.2"/>
      <path d="M140 140 Q 180 120 220 130 L 250 125 Q 260 125 260 135 L 240 150 Q 220 160 170 160 Z" fill="#059669" stroke="#34d399" stroke-width="2.5"/>
      <!-- Outstretched coin / token -->
      <circle cx="235" cy="100" r="18" fill="#fbbf24" stroke="#f59e0b" stroke-width="3"/>
      <text x="235" y="106" font-size="16" font-family="sans-serif" font-weight="bold" fill="#78350f" text-anchor="middle">$</text>
      <!-- Movement curve -->
      <path d="M215 80 C 235 70, 260 85, 265 105" fill="none" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round"/>
      <polygon points="260,105 268,112 272,102" fill="#6ee7b7"/>
    
  </g>
</svg>