<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_borrow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <filter id="glow_borrow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="250" rx="20" fill="url(#bg_borrow)"/>
  <!-- Decorative Grid / Aura -->
  <circle cx="200" cy="125" r="90" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.15" stroke-dasharray="6,6"/>
  <circle cx="340" cy="30" r="70" fill="#818cf8" opacity="0.05"/>
  <circle cx="50" cy="220" r="50" fill="#818cf8" opacity="0.05"/>
  <!-- Main Visual Illustration -->
  <g filter="url(#glow_borrow)">
    
      <rect x="140" y="80" width="80" height="100" rx="8" fill="#3b82f6" opacity="0.3" transform="rotate(-10 180 130)"/>
      <rect x="160" y="70" width="90" height="110" rx="8" fill="#6366f1" stroke="#818cf8" stroke-width="3"/>
      <line x1="175" y1="95" x2="235" y2="95" stroke="#e0e7ff" stroke-width="3" stroke-linecap="round"/>
      <line x1="175" y1="115" x2="225" y2="115" stroke="#c7d2fe" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="175" y1="135" x2="210" y2="135" stroke="#c7d2fe" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Arrow indicating borrowing -->
      <path d="M120 120 C 130 90, 160 80, 180 90" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4,4"/>
      <polygon points="180,85 190,92 180,100" fill="#38bdf8"/>
    
  </g>
</svg>