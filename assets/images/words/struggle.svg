<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_struggle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f1a1a"/>
      <stop offset="100%" stop-color="#5c1d1d"/>
    </linearGradient>
    <filter id="glow_struggle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="250" rx="20" fill="url(#bg_struggle)"/>
  <!-- Decorative Grid / Aura -->
  <circle cx="200" cy="125" r="90" fill="none" stroke="#f87171" stroke-width="1" opacity="0.15" stroke-dasharray="6,6"/>
  <circle cx="340" cy="30" r="70" fill="#f87171" opacity="0.05"/>
  <circle cx="50" cy="220" r="50" fill="#f87171" opacity="0.05"/>
  <!-- Main Visual Illustration -->
  <g filter="url(#glow_struggle)">
    
      <!-- Person pushing uphill boulder -->
      <line x1="120" y1="180" x2="280" y2="90" stroke="#7f1d1d" stroke-width="5" stroke-linecap="round"/>
      <!-- Heavy boulder -->
      <circle cx="215" cy="105" r="32" fill="#991b1b" stroke="#f87171" stroke-width="3"/>
      <!-- Pushing figure -->
      <circle cx="160" cy="130" r="10" fill="#fecaca"/>
      <line x1="160" y1="140" x2="175" y2="160" stroke="#f87171" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="165" y1="145" x2="190" y2="125" stroke="#f87171" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="175" y1="160" x2="155" y2="180" stroke="#f87171" stroke-width="3.5" stroke-linecap="round"/>
    
  </g>
</svg>