<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_craft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <filter id="glow_craft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="250" rx="20" fill="url(#bg_craft)"/>
  <!-- Decorative Grid / Aura -->
  <circle cx="200" cy="125" r="90" fill="none" stroke="#fdba74" stroke-width="1" opacity="0.15" stroke-dasharray="6,6"/>
  <circle cx="340" cy="30" r="70" fill="#fdba74" opacity="0.05"/>
  <circle cx="50" cy="220" r="50" fill="#fdba74" opacity="0.05"/>
  <!-- Main Visual Illustration -->
  <g filter="url(#glow_craft)">
    
      <!-- Crossed artisan tools / hammer and chisel creating a star -->
      <line x1="160" y1="75" x2="240" y2="165" stroke="#ea580c" stroke-width="5" stroke-linecap="round"/>
      <line x1="240" y1="75" x2="160" y2="165" stroke="#ea580c" stroke-width="5" stroke-linecap="round"/>
      <polygon points="145,65 170,60 175,85 150,90" fill="#fdba74"/>
      <polygon points="255,65 230,60 225,85 250,90" fill="#fdba74"/>
      <!-- Masterpiece spark -->
      <circle cx="200" cy="120" r="10" fill="#fef08a"/>
    
  </g>
</svg>