<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_burden" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#44403c"/>
    </linearGradient>
    <filter id="glow_burden" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="250" rx="20" fill="url(#bg_burden)"/>
  <!-- Decorative Grid / Aura -->
  <circle cx="200" cy="125" r="90" fill="none" stroke="#a8a29e" stroke-width="1" opacity="0.15" stroke-dasharray="6,6"/>
  <circle cx="340" cy="30" r="70" fill="#a8a29e" opacity="0.05"/>
  <circle cx="50" cy="220" r="50" fill="#a8a29e" opacity="0.05"/>
  <!-- Main Visual Illustration -->
  <g filter="url(#glow_burden)">
    
      <!-- Overfilled heavy pack / weight scale leaning -->
      <polygon points="150,180 250,180 230,100 170,100" fill="#57534e" stroke="#a8a29e" stroke-width="3"/>
      <rect x="165" y="75" width="70" height="30" rx="6" fill="#78716c"/>
      <!-- Straps straining -->
      <line x1="170" y1="100" x2="160" y2="170" stroke="#d6d3d1" stroke-width="3"/>
      <line x1="230" y1="100" x2="240" y2="170" stroke="#d6d3d1" stroke-width="3"/>
      <!-- Heavy downward stress arrows -->
      <polygon points="200,165 190,145 210,145" fill="#ef4444"/>
    
  </g>
</svg>