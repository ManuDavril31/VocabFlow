<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_outcome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <filter id="glow_outcome" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="250" rx="20" fill="url(#bg_outcome)"/>
  <!-- Decorative Grid / Aura -->
  <circle cx="200" cy="125" r="90" fill="none" stroke="#a5b4fc" stroke-width="1" opacity="0.15" stroke-dasharray="6,6"/>
  <circle cx="340" cy="30" r="70" fill="#a5b4fc" opacity="0.05"/>
  <circle cx="50" cy="220" r="50" fill="#a5b4fc" opacity="0.05"/>
  <!-- Main Visual Illustration -->
  <g filter="url(#glow_outcome)">
    
      <!-- Target bullseye with arrow hitting the exact center -->
      <circle cx="200" cy="120" r="55" fill="#312e81" stroke="#6366f1" stroke-width="3"/>
      <circle cx="200" cy="120" r="38" fill="#4338ca" stroke="#818cf8" stroke-width="2.5"/>
      <circle cx="200" cy="120" r="20" fill="#f43f5e"/>
      <circle cx="200" cy="120" r="8" fill="#fecdd3"/>
      <!-- Arrow shaft planted in center -->
      <line x1="200" y1="120" x2="250" y2="70" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
      <polygon points="245,65 260,60 255,75" fill="#fbbf24"/>
    
  </g>
</svg>