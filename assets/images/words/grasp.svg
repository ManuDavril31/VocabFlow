<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_grasp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <filter id="glow_grasp" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="250" rx="20" fill="url(#bg_grasp)"/>
  <!-- Decorative Grid / Aura -->
  <circle cx="200" cy="125" r="90" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.15" stroke-dasharray="6,6"/>
  <circle cx="340" cy="30" r="70" fill="#a78bfa" opacity="0.05"/>
  <circle cx="50" cy="220" r="50" fill="#a78bfa" opacity="0.05"/>
  <!-- Main Visual Illustration -->
  <g filter="url(#glow_grasp)">
    
      <!-- Hand firmly holding a radiant idea pearl -->
      <circle cx="200" cy="100" r="28" fill="#fbbf24" stroke="#fef08a" stroke-width="3"/>
      <!-- Fingers wrapping around it firmly -->
      <path d="M150 160 C 160 130, 175 90, 185 85 C 195 80, 200 85, 195 95 L 180 140" fill="#6d28d9" stroke="#c4b5fd" stroke-width="2"/>
      <path d="M170 170 C 190 150, 215 100, 220 95 C 228 92, 230 100, 220 110 L 195 160" fill="#5b21b6" stroke="#c4b5fd" stroke-width="2"/>
    
  </g>
</svg>