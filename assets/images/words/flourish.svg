<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_flourish" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <filter id="glow_flourish" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="250" rx="20" fill="url(#bg_flourish)"/>
  <!-- Decorative Grid / Aura -->
  <circle cx="200" cy="125" r="90" fill="none" stroke="#6ee7b7" stroke-width="1" opacity="0.15" stroke-dasharray="6,6"/>
  <circle cx="340" cy="30" r="70" fill="#6ee7b7" opacity="0.05"/>
  <circle cx="50" cy="220" r="50" fill="#6ee7b7" opacity="0.05"/>
  <!-- Main Visual Illustration -->
  <g filter="url(#glow_flourish)">
    
      <!-- Thriving blooming plant / flower unfolding -->
      <path d="M200 180 Q 200 130 200 100" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
      <path d="M200 140 Q 170 130 165 110 Q 185 110 200 130" fill="#34d399"/>
      <path d="M200 120 Q 230 110 235 90 Q 215 90 200 110" fill="#34d399"/>
      <!-- Vibrant blossoms -->
      <circle cx="200" cy="85" r="22" fill="#f43f5e" opacity="0.8"/>
      <circle cx="185" cy="80" r="16" fill="#fb7185"/>
      <circle cx="215" cy="80" r="16" fill="#fb7185"/>
      <circle cx="200" cy="70" r="16" fill="#fda4af"/>
      <circle cx="200" cy="85" r="8" fill="#fef08a"/>
    
  </g>
</svg>