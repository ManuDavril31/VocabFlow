<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_deadline" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <filter id="glow_deadline" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="250" rx="20" fill="url(#bg_deadline)"/>
  <!-- Decorative Grid / Aura -->
  <circle cx="200" cy="125" r="90" fill="none" stroke="#fb7185" stroke-width="1" opacity="0.15" stroke-dasharray="6,6"/>
  <circle cx="340" cy="30" r="70" fill="#fb7185" opacity="0.05"/>
  <circle cx="50" cy="220" r="50" fill="#fb7185" opacity="0.05"/>
  <!-- Main Visual Illustration -->
  <g filter="url(#glow_deadline)">
    
      <!-- Stopwatch / Hourglass alert -->
      <circle cx="200" cy="125" r="50" fill="#9f1239" stroke="#fb7185" stroke-width="3"/>
      <circle cx="200" cy="125" r="4" fill="#ffe4e6"/>
      <!-- Clock hands ticking toward limit -->
      <line x1="200" y1="125" x2="200" y2="90" stroke="#ffe4e6" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="200" y1="125" x2="230" y2="125" stroke="#fda4af" stroke-width="3" stroke-linecap="round"/>
      <!-- Top button of timer -->
      <rect x="194" y="65" width="12" height="10" rx="2" fill="#fb7185"/>
      <line x1="188" y1="65" x2="212" y2="65" stroke="#fb7185" stroke-width="3"/>
      <!-- Urgent pulse rings -->
      <circle cx="200" cy="125" r="62" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="6,6"/>
    
  </g>
</svg>