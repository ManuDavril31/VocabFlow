<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_thrive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <filter id="glow_thrive" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="250" rx="20" fill="url(#bg_thrive)"/>
  <!-- Decorative Grid / Aura -->
  <circle cx="200" cy="125" r="90" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.15" stroke-dasharray="6,6"/>
  <circle cx="340" cy="30" r="70" fill="#2dd4bf" opacity="0.05"/>
  <circle cx="50" cy="220" r="50" fill="#2dd4bf" opacity="0.05"/>
  <!-- Main Visual Illustration -->
  <g filter="url(#glow_thrive)">
    
      <!-- Energetic seedling basking under warm golden sun -->
      <circle cx="200" cy="65" r="32" fill="#fde047" opacity="0.9"/>
      <circle cx="200" cy="65" r="45" fill="none" stroke="#fde047" stroke-width="2" stroke-dasharray="6,6"/>
      <!-- Sprout reaching up with joy -->
      <path d="M200 180 C 195 140, 205 130, 200 105" stroke="#14b8a6" stroke-width="4" stroke-linecap="round"/>
      <path d="M200 135 C 160 120, 160 90, 185 95 C 195 110, 200 120, 200 135" fill="#2dd4bf"/>
      <path d="M200 120 C 240 105, 240 75, 215 80 C 205 95, 200 105, 200 120" fill="#2dd4bf"/>
    
  </g>
</svg>