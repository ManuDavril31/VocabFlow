<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_achieve" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="glow_achieve" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="250" rx="20" fill="url(#bg_achieve)"/>
  <!-- Decorative Grid / Aura -->
  <circle cx="200" cy="125" r="90" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.15" stroke-dasharray="6,6"/>
  <circle cx="340" cy="30" r="70" fill="#fbbf24" opacity="0.05"/>
  <circle cx="50" cy="220" r="50" fill="#fbbf24" opacity="0.05"/>
  <!-- Main Visual Illustration -->
  <g filter="url(#glow_achieve)">
    
      <!-- Mountain peak & Flag -->
      <polygon points="110,180 200,70 290,180" fill="#92400e" opacity="0.6"/>
      <polygon points="150,180 200,90 250,180" fill="#b45309"/>
      <polygon points="200,70 180,95 200,105 220,95" fill="#fef3c7"/>
      <!-- Flag at summit -->
      <line x1="200" y1="70" x2="200" y2="40" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
      <polygon points="200,42 235,52 200,62" fill="#ef4444"/>
      <!-- Stars of achievement -->
      <circle cx="150" cy="65" r="4" fill="#fde047"/>
      <circle cx="250" cy="65" r="4" fill="#fde047"/>
      <circle cx="200" cy="28" r="6" fill="#fde047"/>
    
  </g>
</svg>