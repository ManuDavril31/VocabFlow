<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_effortless" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="glow_effortless" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="250" rx="20" fill="url(#bg_effortless)"/>
  <!-- Decorative Grid / Aura -->
  <circle cx="200" cy="125" r="90" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.15" stroke-dasharray="6,6"/>
  <circle cx="340" cy="30" r="70" fill="#38bdf8" opacity="0.05"/>
  <circle cx="50" cy="220" r="50" fill="#38bdf8" opacity="0.05"/>
  <!-- Main Visual Illustration -->
  <g filter="url(#glow_effortless)">
    
      <!-- Floating weightless feather / breeze -->
      <path d="M140 150 Q 180 145 220 90 Q 240 60 260 65 Q 265 85 240 120 Q 200 165 140 150 Z" fill="#0284c7" opacity="0.3"/>
      <path d="M150 155 Q 200 130 250 70" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
      <!-- Soft breeze ripples -->
      <path d="M120 100 Q 150 90 180 100" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <path d="M150 125 Q 180 115 210 125" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <circle cx="255" cy="65" r="5" fill="#e0f2fe"/>
    
  </g>
</svg>