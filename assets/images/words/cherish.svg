<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_cherish" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a044e"/>
      <stop offset="100%" stop-color="#701a75"/>
    </linearGradient>
    <filter id="glow_cherish" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="250" rx="20" fill="url(#bg_cherish)"/>
  <!-- Decorative Grid / Aura -->
  <circle cx="200" cy="125" r="90" fill="none" stroke="#f472b6" stroke-width="1" opacity="0.15" stroke-dasharray="6,6"/>
  <circle cx="340" cy="30" r="70" fill="#f472b6" opacity="0.05"/>
  <circle cx="50" cy="220" r="50" fill="#f472b6" opacity="0.05"/>
  <!-- Main Visual Illustration -->
  <g filter="url(#glow_cherish)">
    
      <!-- Glowing heart held gently between protective caring hands -->
      <path d="M200 95 C 190 75, 160 75, 160 100 C 160 125, 200 150, 200 150 C 200 150, 240 125, 240 100 C 240 75, 210 75, 200 95 Z" fill="#ec4899" stroke="#f472b6" stroke-width="2.5"/>
      <!-- Gentle protective cupping curves -->
      <path d="M140 155 Q 170 175 200 175 Q 230 175 260 155" fill="none" stroke="#fbcfe8" stroke-width="3" stroke-linecap="round"/>
      <circle cx="185" cy="95" r="4" fill="#ffffff" opacity="0.6"/>
    
  </g>
</svg>