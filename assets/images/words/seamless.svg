<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_seamless" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow_seamless" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="250" rx="20" fill="url(#bg_seamless)"/>
  <!-- Decorative Grid / Aura -->
  <circle cx="200" cy="125" r="90" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.15" stroke-dasharray="6,6"/>
  <circle cx="340" cy="30" r="70" fill="#38bdf8" opacity="0.05"/>
  <circle cx="50" cy="220" r="50" fill="#38bdf8" opacity="0.05"/>
  <!-- Main Visual Illustration -->
  <g filter="url(#glow_seamless)">
    
      <!-- Two interlocking precision gears working with zero gap -->
      <circle cx="170" cy="120" r="35" fill="#0284c7" opacity="0.7"/>
      <circle cx="170" cy="120" r="14" fill="#0f172a"/>
      <circle cx="230" cy="120" r="35" fill="#0369a1" opacity="0.7"/>
      <circle cx="230" cy="120" r="14" fill="#0f172a"/>
      <!-- Continuous infinity flow line -->
      <path d="M150 120 C 150 80, 250 160, 250 120 C 250 80, 150 160, 150 120 Z" fill="none" stroke="#38bdf8" stroke-width="3"/>
    
  </g>
</svg>