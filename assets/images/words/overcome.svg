<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_overcome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <filter id="glow_overcome" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="250" rx="20" fill="url(#bg_overcome)"/>
  <!-- Decorative Grid / Aura -->
  <circle cx="200" cy="125" r="90" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.15" stroke-dasharray="6,6"/>
  <circle cx="340" cy="30" r="70" fill="#c084fc" opacity="0.05"/>
  <circle cx="50" cy="220" r="50" fill="#c084fc" opacity="0.05"/>
  <!-- Main Visual Illustration -->
  <g filter="url(#glow_overcome)">
    
      <!-- Wall / Hurdle and a soaring leap -->
      <rect x="185" y="110" width="30" height="70" rx="4" fill="#4c1d95" stroke="#7c3aed" stroke-width="2"/>
      <!-- Leaping arc over hurdle -->
      <path d="M130 170 Q 200 40 270 170" fill="none" stroke="#c084fc" stroke-width="4" stroke-linecap="round"/>
      <!-- Radiant figure/star soaring at zenith -->
      <circle cx="200" cy="55" r="14" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
      <polygon points="200,32 204,44 216,48 204,52 200,64 196,52 184,48 196,44" fill="#fbbf24"/>
    
  </g>
</svg>