<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_breakthrough" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="glow_breakthrough" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="250" rx="20" fill="url(#bg_breakthrough)"/>
  <!-- Decorative Grid / Aura -->
  <circle cx="200" cy="125" r="90" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.15" stroke-dasharray="6,6"/>
  <circle cx="340" cy="30" r="70" fill="#60a5fa" opacity="0.05"/>
  <circle cx="50" cy="220" r="50" fill="#60a5fa" opacity="0.05"/>
  <!-- Main Visual Illustration -->
  <g filter="url(#glow_breakthrough)">
    
      <!-- Wall cracked open by radiant beam / rocket -->
      <polygon points="140,60 180,60 170,180 130,180" fill="#1e293b"/>
      <polygon points="220,60 260,60 270,180 230,180" fill="#1e293b"/>
      <!-- Energy beam breaking through -->
      <polygon points="185,50 215,50 235,190 165,190" fill="#38bdf8" opacity="0.3"/>
      <!-- Lightning burst -->
      <polygon points="205,40 180,105 210,105 190,170 230,95 200,95" fill="#facc15" stroke="#fef08a" stroke-width="2"/>
    
  </g>
</svg>