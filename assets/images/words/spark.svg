<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <filter id="glow_spark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="250" rx="20" fill="url(#bg_spark)"/>
  <!-- Decorative Grid / Aura -->
  <circle cx="200" cy="125" r="90" fill="none" stroke="#fb923c" stroke-width="1" opacity="0.15" stroke-dasharray="6,6"/>
  <circle cx="340" cy="30" r="70" fill="#fb923c" opacity="0.05"/>
  <circle cx="50" cy="220" r="50" fill="#fb923c" opacity="0.05"/>
  <!-- Main Visual Illustration -->
  <g filter="url(#glow_spark)">
    
      <!-- Dynamic spark / flash igniting -->
      <polygon points="200,40 210,95 260,105 210,115 200,170 190,115 140,105 190,95" fill="#f97316" stroke="#fed7aa" stroke-width="2"/>
      <circle cx="200" cy="105" r="14" fill="#fff7ed"/>
      <!-- Radiant sparks -->
      <circle cx="160" cy="65" r="5" fill="#facc15"/>
      <circle cx="240" cy="65" r="4" fill="#facc15"/>
      <circle cx="155" cy="145" r="3.5" fill="#facc15"/>
      <circle cx="245" cy="145" r="5" fill="#facc15"/>
    
  </g>
</svg>