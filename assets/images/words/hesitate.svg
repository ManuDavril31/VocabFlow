<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_hesitate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#332a15"/>
      <stop offset="100%" stop-color="#4a3c1c"/>
    </linearGradient>
    <filter id="glow_hesitate" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="250" rx="20" fill="url(#bg_hesitate)"/>
  <!-- Decorative Grid / Aura -->
  <circle cx="200" cy="125" r="90" fill="none" stroke="#fcd34d" stroke-width="1" opacity="0.15" stroke-dasharray="6,6"/>
  <circle cx="340" cy="30" r="70" fill="#fcd34d" opacity="0.05"/>
  <circle cx="50" cy="220" r="50" fill="#fcd34d" opacity="0.05"/>
  <!-- Main Visual Illustration -->
  <g filter="url(#glow_hesitate)">
    
      <!-- Signpost with arrows pointing in different directions -->
      <rect x="195" y="60" width="10" height="120" rx="4" fill="#78350f"/>
      <!-- Left sign -->
      <polygon points="120,80 195,80 195,105 120,105 105,92" fill="#d97706" stroke="#fcd34d" stroke-width="2"/>
      <text x="150" y="98" font-size="12" font-family="sans-serif" font-weight="bold" fill="#fef3c7" text-anchor="middle">A</text>
      <!-- Right sign -->
      <polygon points="205,115 280,115 295,128 280,140 205,140" fill="#b45309" stroke="#fcd34d" stroke-width="2"/>
      <text x="245" y="133" font-size="12" font-family="sans-serif" font-weight="bold" fill="#fef3c7" text-anchor="middle">B ?</text>
      <!-- Question mark pulse -->
      <circle cx="200" cy="40" r="14" fill="#fbbf24"/>
      <text x="200" y="46" font-size="16" font-family="sans-serif" font-weight="bold" fill="#451a03" text-anchor="middle">?</text>
    
  </g>
</svg>